server:
  host: "127.0.0.1"
  port: 5180
  auto_open_browser: true
  lan_pin: "1111"

media:
  input_audio_dir: "input-audio"
  main_video_dir: "main-videos"
  material_video_dir: "material-videos"
  common_video_file: "common_movie.mp4"

audio:
  preferred_input: ""
  preferred_input_type: capture
  sample_rate: 11025
  detection_window_seconds: 4

audio_position_offsets:

detection:
  interval_seconds: 1
  confidence_threshold: 0.62
  tentative_confidence_threshold: 0.55
  tentative_confirmation_count: 2
  minimum_input_decibels: -48
  tempo_ratios: [0.90, 0.93, 0.95, 1.00, 1.05, 1.10, 1.15, 1.17]
  playback_rate_tolerance: 0.015

playback:
  detection_lost_timeout_seconds: 10
  resync_tolerance_seconds: 2
  randomize_common_start: true
  minimum_rate: 0.8
  maximum_rate: 1.2
  minimum_bpm: 100
  maximum_bpm: 200

transition:
  enabled: true
  duration_ms: 1200
  blend_modes_enabled: true
  randomize_blend_mode: true
  blend_modes: ["screen", "multiply", "overlay", "soft-light", "difference"]

glitch:
  enabled: true
  confidence_threshold: 0.4
  files: ["glitch1.mp4", "glitch2.mp4", "glitch3.mp4"]

storage:
  database_path: "data/autovj.db"

ffmpeg:
  path: "ffmpeg"
  ffprobe_path: "ffprobe"
